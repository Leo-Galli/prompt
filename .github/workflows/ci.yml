name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Smoke check
        run: |
          test -f LICENSE
          test -f README.md
          test -f CONTRIBUTING.md
          python -c "print('smoke ok')"

      - name: prompt-lint tests
        run: python -m unittest discover -s prompt_lint/tests -v
        env:
          PYTHONPATH: .

      - name: prompt-lint templates
        run: python -m prompt_lint templates/
        env:
          PYTHONPATH: .

      - name: ch01 companion tests
        run: python -m unittest discover -s ch01-how-models-read/tests -v

      - name: ch02 companion tests
        run: python -m unittest discover -s ch02-anatomy/tests -v

      - name: ch03 companion tests
        run: python -m unittest discover -s ch03-output-format/tests -v

      - name: ch04 companion tests
        run: python -m unittest discover -s ch04-few-shot/tests -v

      - name: ch05 companion tests
        run: python -m unittest discover -s ch05-reasoning/tests -v

      - name: ch06 companion tests
        run: python -m unittest discover -s ch06-decomposition/tests -v

      - name: ch07 companion tests
        run: python -m unittest discover -s ch07-code/tests -v

      - name: ch08 companion tests
        run: python -m unittest discover -s ch08-repo-rules/tests -v

      - name: ch09 companion tests
        run: python -m unittest discover -s ch09-spec-progress/tests -v

      - name: ch10 companion tests
        run: python -m unittest discover -s ch10-one-task/tests -v

      - name: ch11 companion tests
        run: python -m unittest discover -s ch11-fix-pass/tests -v

      - name: ch12 companion tests
        run: python -m unittest discover -s ch12-documents/tests -v

      - name: ch13 companion tests
        run: python -m unittest discover -s ch13-media/tests -v

      - name: ch14 companion tests
        run: python -m unittest discover -s ch14-safety/tests -v

      - name: ch15 companion tests
        run: python -m unittest discover -s ch15-eval/tests -v

      - name: ch16 companion tests
        run: python -m unittest discover -s ch16-library/tests -v
        env:
          PYTHONPATH: .

      - name: ch17 companion tests
        run: python -m unittest discover -s ch17-capstone-book/tests -v

      - name: ch18 companion tests
        run: python -m unittest discover -s ch18-daily-practice/tests -v
        env:
          PYTHONPATH: .
